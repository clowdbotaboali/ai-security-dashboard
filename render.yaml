services:
  - type: web
    name: ai-security-dashboard
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn server:app --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: FLASK_HOST
        value: "0.0.0.0"
      - key: FLASK_DEBUG
        value: "false"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DASHBOARD_API_KEY
        sync: false
